<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔐</div>
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Login to your account to manage your tasks.</p>
    </div>

    <form [formGroup]="loginForm" class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="john@example.com"
            formControlName="email"
          />
        </div>
        @if (email?.invalid && (email?.dirty || email?.touched)) {
          <div class="error-message">
            <span>Please enter a valid email address</span>
          </div>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            formControlName="password"
          />
        </div>
        @if (password?.invalid && (password?.dirty || password?.touched)) {
          <div class="error-message">
            <span>Password is required</span>
          </div>
        }
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loginForm.invalid"
        [class.btn-disabled]="loginForm.invalid"
      >
        Login
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/auth/register" class="link">Sign Up</a></p>
    </div>
  </div>
</div>
